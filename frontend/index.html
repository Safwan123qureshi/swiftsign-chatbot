<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swift Sign Group AI Chatbot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 600px;
        }

        .chat-header {
            background-color: #003366;
            color: #ffffff;
            padding: 16px;
            text-align: center;
        }

        .chat-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .brand-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px;
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            justify-content: center;
        }

        .brand-btn {
            background-color: #ffffff;
            border: 1px solid #003366;
            color: #003366;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .brand-btn.active, .brand-btn:hover {
            background-color: #003366;
            color: #ffffff;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .message.system {
            background-color: #f0f4f8;
            color: #333333;
            align-self: flex-start;
        }

        .message.user {
            background-color: #003366;
            color: #ffffff;
            align-self: flex-end;
        }

        .message.bot {
            background-color: #eef2f6;
            color: #1a202c;
            align-self: flex-start;
        }

        .message.error {
            background-color: #fee2e2;
            color: #991b1b;
            align-self: flex-start;
            border: 1px solid #fecaca;
        }

        .chat-input-container {
            padding: 12px;
            background-color: #ffffff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 8px;
        }

        .chat-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        .chat-input:focus {
            border-color: #003366;
        }

        .send-btn {
            background-color: #003366;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .send-btn:hover {
            background-color: #002244;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h2>Swift Sign Group of Companies</h2>
    </div>

    <div class="brand-selector">
        <button class="brand-btn active" onclick="selectBrand('IT & Cyber Solutions', this)">IT & Cyber</button>
        <button class="brand-btn" onclick="selectBrand('Business Management', this)">Business Mgmt</button>
        <button class="brand-btn" onclick="selectBrand('Shipping & Trading', this)">Shipping & Trading</button>
        <button class="brand-btn" onclick="selectBrand('Laila Hijab', this)">Laila Hijab</button>
        <button class="brand-btn" onclick="selectBrand('Organic Food', this)">Organic Food</button>
        <button class="brand-btn" onclick="selectBrand('Corporate Info', this)">Corporate Info</button>
    </div>

    <div class="chat-messages" id="chat-messages">
        <div class="message system" id="welcome-msg">
            Welcome to <b>Swift Sign Group</b>. Selected unit: <b>IT & Cyber Solutions</b>. How can we help you?
        </div>
    </div>

    <div class="chat-input-container">
        <input type="text" id="user-input" class="chat-input" placeholder="Ask about services, locations, or contact..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    let currentBrand = "IT & Cyber Solutions";
    let sessionId = "session_" + Math.random().toString(36).substring(2, 9);

    function selectBrand(brandName, btnElement) {
        currentBrand = brandName;
        document.querySelectorAll('.brand-btn').forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');
        
        const welcomeMsg = document.getElementById('welcome-msg');
        if (welcomeMsg) {
            welcomeMsg.innerHTML = `Welcome to <b>Swift Sign Group</b>. Selected unit: <b>${brandName}</b>. How can we help you?`;
        }
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    function appendMessage(text, sender) {
        const chatMessages = document.getElementById('chat-messages');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.innerText = text;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const message = inputField.value.trim();
        if (!message) return;

        appendMessage(message, 'user');
        inputField.value = '';

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    session_id: sessionId,
                    brand: currentBrand,
                    message: message
                })
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.detail || `Server status: ${response.status}`);
            }

            const data = await response.json();
            appendMessage(data.response, 'bot');
        } catch (error) {
            console.error('Fetch Error:', error);
            appendMessage('⚠️ ' + error.message, 'error');
        }
    }
</script>

</body>
</html>
